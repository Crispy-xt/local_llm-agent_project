[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-agent"
version = "0.1.0"
description = "A staged learning project for TinyLM training and local Agent systems."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["tiny_lm*"]
